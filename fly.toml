app = 'rag-chunking-lab-api'
primary_region = 'sin'  # nearest open region to Supabase ap-south-1 (bom is deprecated)

[build]
  dockerfile = 'Dockerfile'

[env]
  EMBEDDING_PROVIDER = 'local'
  SUPABASE_REGION = 'ap-south-1'
  # localhost for dev, plus the Vercel production alias and preview URLs
  CORS_ORIGIN_REGEX = 'http://(localhost|127\.0\.0\.1):\d+|https://web-[a-z0-9-]+\.vercel\.app'

[http_service]
  internal_port = 8080
  force_https = true
  # Indexing jobs and their progress live in memory, so keep one machine up
  # rather than letting Fly stop it mid-job.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/docs'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
