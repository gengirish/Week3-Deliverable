name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (Next.js build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # next build also runs the TypeScript type check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:8010

  api:
    name: API + pipeline (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.11 — psycopg2-binary and numpy 1.26 have no wheels for 3.13
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            rag_pipeline/requirements.txt
            api/requirements.txt

      # sentence-transformers pulls in torch (~2 GB) and is only imported lazily
      # when the local embedding model runs, so CI skips it.
      - name: Install dependencies
        run: |
          grep -v '^sentence-transformers' rag_pipeline/requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt -r api/requirements.txt

      - name: Byte-compile
        run: python -m compileall -q api rag_pipeline -x '\.venv'

      # Importing the app wires every module together without touching the
      # database or loading the embedding model, so it needs no secrets.
      - name: Import smoke test
        working-directory: api
        run: |
          python -c "import main; routes = {r.path for r in main.app.routes}; assert '/api/status' in routes, routes; print(f'{len(routes)} routes OK')"
